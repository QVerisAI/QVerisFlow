# Alembic 配置文件
# Agent Framework 数据库迁移

[alembic]
# 迁移脚本位置
script_location = src/storage/migrations

# 数据库 URL（可通过环境变量覆盖）
# 格式: driver://user:pass@host/dbname
# 例如: postgresql://postgres:password@localhost:5432/agent_framework
sqlalchemy.url = sqlite:///./agent_framework.db

# 模板文件
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 是否输出时间戳
# timezone = utc

# 是否包含带有标签的默认值
# prepend_sys_path = .

# 调整日志格式
[logging]
level = INFO
format = %(levelname)-5.5s [%(name)s] %(message)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
