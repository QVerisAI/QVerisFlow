name: Review approval tests

on:
  pull_request:
    paths:
      - .github/workflows/review-auto-approve.yml
      - .github/workflows/review-approval-tests.yml
      - .github/workflows/review-approval-receipt.yml
      - scripts/auto-approve-review.cjs
      - scripts/auto-approve-review.test.mjs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - run: node --test scripts/auto-approve-review.test.mjs
