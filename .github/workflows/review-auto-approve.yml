name: Review auto approval

on:
  schedule:
    - cron: '23 * * * *'
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Review approval receipt]
    types: [completed]
  pull_request_target:
    types: [synchronize, reopened, ready_for_review, converted_to_draft, edited, closed]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number to reconcile against its current head
        required: false
        type: number

permissions:
  contents: read

jobs:
  approve:
    concurrency:
      group: >-
        review-approval-${{ github.repository }}-${{ github.event.workflow_run.display_title || format('Review approval for PR #{0}', github.event.issue.number || github.event.pull_request.number || inputs.pull_number) }}
      cancel-in-progress: false
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.id == 199175422 &&
       github.event.comment.performed_via_github_app.id == 1144995) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request_review' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.pull_number &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted approval logic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify review App configuration
        env:
          REVIEW_APP_ID: ${{ vars.REVIEW_APP_ID }}
          REVIEW_APP_PRIVATE_KEY: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$REVIEW_APP_ID" ] || [ -z "$REVIEW_APP_PRIVATE_KEY" ]; then
            echo '::error::Configure REVIEW_APP_ID and REVIEW_APP_PRIVATE_KEY for an independent review App installed on this repository. No approval was submitted.'
            exit 1
          fi

      - name: Create repository-scoped review token
        id: review-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Reconcile current-head approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          REVIEW_APP_TOKEN: ${{ steps.review-token.outputs.token }}
          REVIEW_APP_SLUG: ${{ steps.review-token.outputs.app-slug }}
        with:
          script: |
            const { reconcileApproval } = require(`${process.env.GITHUB_WORKSPACE}/scripts/auto-approve-review.cjs`);
            const appGithub = new github.constructor({ auth: process.env.REVIEW_APP_TOKEN });
            const result = await reconcileApproval({
              github, appGithub, context, appSlug: process.env.REVIEW_APP_SLUG,
            });
            core.info(JSON.stringify(result));
            await core.summary.addHeading('Review approval result')
              .addRaw(`PR #${result.number}: ${result.result}\n\nCommit: ${result.sha}\n\n${result.reason || result.url || ''}`)
              .write();

  discover-sweep:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && !inputs.pull_number &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      numbers: ${{ steps.pulls.outputs.numbers }}
    steps:
      - name: List open pull requests
        id: pulls
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', per_page: 100,
            });
            core.setOutput('numbers', JSON.stringify(pulls.map(pr => pr.number)));

  sweep:
    needs: discover-sweep
    if: needs.discover-sweep.outputs.numbers != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pull_number: ${{ fromJSON(needs.discover-sweep.outputs.numbers) }}
    concurrency:
      group: >-
        review-approval-${{ github.repository }}-${{ format('Review approval for PR #{0}', matrix.pull_number) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted approval logic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create repository-scoped review token
        id: review-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Reconcile current-head approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          REVIEW_APP_TOKEN: ${{ steps.review-token.outputs.token }}
          REVIEW_APP_SLUG: ${{ steps.review-token.outputs.app-slug }}
          PULL_NUMBER: ${{ matrix.pull_number }}
        with:
          script: |
            const { reconcileApproval, contextForPullRequest } = require(`${process.env.GITHUB_WORKSPACE}/scripts/auto-approve-review.cjs`);
            const appGithub = new github.constructor({ auth: process.env.REVIEW_APP_TOKEN });
            const result = await reconcileApproval({ github, appGithub,
              context: contextForPullRequest(context, process.env.PULL_NUMBER),
              appSlug: process.env.REVIEW_APP_SLUG });
            core.info(JSON.stringify(result));
            await core.summary.addHeading('Review approval result')
              .addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
